[project]
name = "es-futures-ingest"
version = "0.1.0"
description = "Ingest daily front-month ES futures data from Polygon.io into S3"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "boto3>=1.34",
    "pydantic>=2.6",
    "tenacity>=8.2",
    "pandas-market-calendars>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "moto[s3,secretsmanager]>=5.0",
    "ruff>=0.4",
    "jsonschema>=4.21",
]

[project.scripts]
ingest-es-futures = "es_futures_ingest.backfill_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
